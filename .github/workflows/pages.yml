name: Check game and optionally publish Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_pages:
        description: 'Publish a separate GitHub Pages copy (requires Pages setup; no Sites access controls)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      # Dependencies are vendored; there is no install/build step.
      - run: npm run check
      - run: npm test

  deploy:
    # ChatGPT Sites is the primary host. Pages publishing is an explicit opt-in.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pages == true && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish playable game
        id: deployment
        uses: actions/deploy-pages@v4
